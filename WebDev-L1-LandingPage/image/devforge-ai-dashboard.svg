    <rect x="106" y="334" width="374" height="168" rx="16" fill="url(#cardGrad)" stroke="#1E2A47" stroke-width="1"/>
    <text x="126" y="360" font-size="13.5" font-weight="bold" fill="#F3F6FC">Sprint Tasks</text>
    <text x="454" y="360" font-size="10.5" fill="#5FB4FF" text-anchor="end">View all</text>
    <line x1="126" y1="370" x2="460" y2="370" stroke="#1E2A47" stroke-width="1"/>

    <!-- task rows -->
    <g>
      <circle cx="136" cy="390" r="7" fill="#34D399" opacity="0.2"/>
      <path d="M132.5,390 l2.5,2.5 l4.5,-4.5" fill="none" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="394" font-size="11.5" fill="#D7DEEF">Set up GitHub webhook sync</text>
      <rect x="392" y="382" width="60" height="18" rx="9" fill="#1B3A2B"/>
      <text x="422" y="394.5" font-size="9.5" fill="#4ADE80" text-anchor="middle">Done</text>
    </g>
    <g>
      <circle cx="136" cy="422" r="7" fill="#FBBF24" opacity="0.2"/>
      <path d="M136,417 v6 M136,426 v0.5" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
      <text x="152" y="426" font-size="11.5" fill="#D7DEEF">Design bug-severity tag system</text>
      <rect x="374" y="414" width="78" height="18" rx="9" fill="#3A2E12"/>
      <text x="413" y="426.5" font-size="9.5" fill="#FBBF24" text-anchor="middle">In Progress</text>
    </g>
    <g>
      <circle cx="136" cy="454" r="7" fill="#FBBF24" opacity="0.2"/>
      <path d="M136,449 v6 M136,458 v0.5" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
      <text x="152" y="458" font-size="11.5" fill="#D7DEEF">Wire AI assistant to task panel</text>
      <rect x="374" y="446" width="78" height="18" rx="9" fill="#3A2E12"/>
      <text x="413" y="458.5" font-size="9.5" fill="#FBBF24" text-anchor="middle">In Progress</text>
    </g>
    <g>
      <circle cx="136" cy="486" r="7" fill="none" stroke="#5B6B8C" stroke-width="1.6"/>
      <text x="152" y="490" font-size="11.5" fill="#8592B4">Write onboarding checklist</text>
      <rect x="402" y="478" width="50" height="18" rx="9" fill="#1C2740"/>
      <text x="427" y="490.5" font-size="9.5" fill="#8592B4" text-anchor="middle">Todo</text>
    </g>

    <!-- Bug Tracker card -->
    <rect x="106" y="514" width="374" height="150" rx="16" fill="url(#cardGrad)" stroke="#1E2A47" stroke-width="1"/>
    <text x="126" y="540" font-size="13.5" font-weight="bold" fill="#F3F6FC">Bug Tracker</text>
    <text x="454" y="540" font-size="10.5" fill="#5FB4FF" text-anchor="end">View all</text>
    <line x1="126" y1="550" x2="460" y2="550" stroke="#1E2A47" stroke-width="1"/>

    <g>
      <rect x="126" y="562" width="54" height="18" rx="9" fill="#3A1620"/>
      <text x="153" y="574.5" font-size="9.5" fill="#F87171" text-anchor="middle">Critical</text>
      <text x="190" y="574.5" font-size="11" fill="#D7DEEF">Null pointer in repo sync job</text>
      <circle cx="452" cy="571" r="10" fill="#233150"/>
      <text x="452" y="574.5" font-size="9" fill="#A6B2D1" text-anchor="middle">AK</text>
    </g>
    <g>
      <rect x="126" y="596" width="54" height="18" rx="9" fill="#3A2E12"/>
      <text x="153" y="608.5" font-size="9.5" fill="#FBBF24" text-anchor="middle">Medium</text>
      <text x="190" y="608.5" font-size="11" fill="#D7DEEF">Dashboard chart mis-renders</text>
      <circle cx="452" cy="605" r="10" fill="#233150"/>
      <text x="452" y="608.5" font-size="9" fill="#A6B2D1" text-anchor="middle">JM</text>
    </g>
    <g>
      <rect x="126" y="630" width="54" height="18" rx="9" fill="#12331F"/>
      <text x="153" y="642.5" font-size="9.5" fill="#4ADE80" text-anchor="middle">Low</text>
      <text x="190" y="642.5" font-size="11" fill="#D7DEEF">Typo in settings panel label</text>
      <circle cx="452" cy="639" r="10" fill="#233150"/>
      <text x="452" y="642.5" font-size="9" fill="#A6B2D1" text-anchor="middle">RT</text>
    </g>

    <!-- GitHub Integration card -->
    <rect x="106" y="676" width="374" height="96" rx="16" fill="url(#cardGrad)" stroke="#1E2A47" stroke-width="1"/>
    <rect x="124" y="694" width="34" height="34" rx="10" fill="#1C2740"/>
    <circle cx="141" cy="708" r="7" fill="none" stroke="#D7DEEF" stroke-width="1.8"/>
    <path d="M136,714 c-1.5,1 -2.5,-0.5 -3,-1.5" fill="none" stroke="#D7DEEF" stroke-width="1.4" stroke-linecap="round"/>
    <text x="170" y="704" font-size="12.5" font-weight="bold" fill="#F3F6FC">devforge/core-api</text>
    <text x="170" y="720" font-size="10.5" fill="#8592B4">main · 3 commits ahead</text>
    <circle cx="174" cy="736" r="4" fill="#34D399"/>
    <text x="184" y="740" font-size="10" fill="#4ADE80">Synced</text>
    <rect x="392" y="722" width="62" height="24" rx="12" fill="none" stroke="#2A3A63" stroke-width="1.4"/>
    <text x="423" y="738" font-size="9.5" fill="#A6B2D1" text-anchor="middle">View Repo</text>

  </g>
</svg>
