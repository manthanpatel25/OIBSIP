<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151E33"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2947"/>
      <stop offset="100%" stop-color="#131D33"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frameClip">
      <rect x="0" y="0" width="500" height="800" rx="22"/>
    </clipPath>
  </defs>

  <!-- Outer frame -->
  <g filter="url(#softShadow)">
    <rect x="0" y="0" width="500" height="800" rx="22" fill="#0A0F1D"/>
  </g>

  <g clip-path="url(#frameClip)">
    <rect x="0" y="0" width="500" height="800" fill="#0A0F1D"/>

    <!-- Top window bar -->
    <rect x="0" y="0" width="500" height="44" fill="#0D1425"/>
    <circle cx="22" cy="22" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="22" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="22" r="5" fill="#28C840"/>
    <text x="250" y="26" font-size="12" fill="#5B6B8C" text-anchor="middle">app.devforge.ai/dashboard</text>
    <line x1="0" y1="44" x2="500" y2="44" stroke="#1C2740" stroke-width="1"/>

    <!-- Sidebar -->
    <rect x="0" y="44" width="82" height="756" fill="#0D1425"/>
    <line x1="82" y1="44" x2="82" y2="800" stroke="#1C2740" stroke-width="1"/>

    <!-- Sidebar logo mark -->
    <rect x="21" y="70" width="40" height="40" rx="12" fill="url(#brandGrad)"/>
    <circle cx="33" cy="98" r="2.6" fill="#FFFFFF"/>
    <circle cx="41" cy="90" r="2.6" fill="#FFFFFF"/>
    <circle cx="49" cy="82" r="2.6" fill="#FFFFFF"/>
    <line x1="33" y1="98" x2="41" y2="90" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="41" y1="90" x2="49" y2="82" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Sidebar nav items -->
    <!-- Active: Dashboard -->
    <rect x="16" y="134" width="50" height="42" rx="12" fill="url(#brandGrad)" opacity="0.18"/>
    <rect x="16" y="134" width="4" height="42" rx="2" fill="url(#brandGrad)"/>
    <rect x="31" y="146" width="18" height="18" rx="4" fill="none" stroke="#5FB4FF" stroke-width="2"/>
    <rect x="35" y="150" width="10" height="4" fill="#5FB4FF"/>
    <rect x="35" y="156" width="6" height="4" fill="#5FB4FF"/>

    <!-- Tasks -->
    <g opacity="0.55">
      <circle cx="41" cy="204" r="9" fill="none" stroke="#8B9AC0" stroke-width="2"/>
      <path d="M37,204 l3,3 l6,-6" fill="none" stroke="#8B9AC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bugs -->
    <g opacity="0.55">
      <ellipse cx="41" cy="248" rx="7" ry="9" fill="none" stroke="#8B9AC0" stroke-width="2"/>
      <line x1="34" y1="242" x2="30" y2="238" stroke="#8B9AC0" stroke-width="2" stroke-linecap="round"/>
      <line x1="48" y1="242" x2="52" y2="238" stroke="#8B9AC0" stroke-width="2" stroke-linecap="round"/>
      <line x1="34" y1="248" x2="28" y2="248" stroke="#8B9AC0" stroke-width="2" stroke-linecap="round"/>
      <line x1="48" y1="248" x2="54" y2="248" stroke="#8B9AC0" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- GitHub -->
    <g opacity="0.55">
      <circle cx="41" cy="292" r="10" fill="none" stroke="#8B9AC0" stroke-width="2"/>
      <path d="M36,296 c-2,1 -3,-1 -4,-2" fill="none" stroke="#8B9AC0" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Team -->
    <g opacity="0.55">
      <circle cx="36" cy="333" r="5" fill="none" stroke="#8B9AC0" stroke-width="2"/>
      <circle cx="47" cy="333" r="5" fill="none" stroke="#8B9AC0" stroke-width="2"/>
    </g>

    <!-- AI bot -->
    <g opacity="0.55">
      <rect x="32" y="368" width="18" height="14" rx="4" fill="none" stroke="#8B9AC0" stroke-width="2"/>
      <circle cx="37.5" cy="375" r="1.6" fill="#8B9AC0"/>
      <circle cx="44.5" cy="375" r="1.6" fill="#8B9AC0"/>
      <line x1="41" y1="364" x2="41" y2="368" stroke="#8B9AC0" stroke-width="2"/>
    </g>

    <!-- Bottom avatar -->
    <circle cx="41" cy="760" r="16" fill="#1C2740"/>
    <circle cx="41" cy="755" r="6" fill="#5B6B8C"/>
    <path d="M30,768 a11,11 0 0 1 22,0" fill="#5B6B8C"/>

    <!-- ===================== MAIN CONTENT ===================== -->

    <!-- Greeting -->
    <text x="106" y="86" font-size="20" font-weight="bold" fill="#F3F6FC">Good morning, Alex</text>
    <text x="106" y="108" font-size="12.5" fill="#7C8AAD">Here's what's happening across your projects</text>

    <!-- Search pill -->
    <rect x="360" y="66" width="118" height="34" rx="17" fill="#101828" stroke="#232F4D" stroke-width="1"/>
    <circle cx="378" cy="83" r="5" fill="none" stroke="#6C7CA0" stroke-width="1.6"/>
    <line x1="382" y1="87" x2="386" y2="91" stroke="#6C7CA0" stroke-width="1.6" stroke-linecap="round"/>
    <text x="396" y="87" font-size="11" fill="#6C7CA0">Search...</text>

    <!-- Stat cards -->
    <g>
      <rect x="106" y="130" width="118" height="76" rx="14" fill="url(#cardGrad)" stroke="#1E2A47" stroke-width="1"/>
      <text x="122" y="158" font-size="22" font-weight="bold" fill="#F3F6FC">12</text>
      <text x="122" y="176" font-size="10.5" fill="#8592B4">Active Tasks</text>
      <circle cx="200" cy="150" r="12" fill="#3B82F6" opacity="0.15"/>
      <path d="M195,150 l3,3 l7,-7" fill="none" stroke="#5FB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g>
      <rect x="234" y="130" width="118" height="76" rx="14" fill="url(#cardGrad)" stroke="#1E2A47" stroke-width="1"/>
      <text x="250" y="158" font-size="22" font-weight="bold" fill="#F3F6FC">5</text>
      <text x="250" y="176" font-size="10.5" fill="#8592B4">Open Bugs</text>
      <circle cx="328" cy="150" r="12" fill="#F87171" opacity="0.15"/>
      <ellipse cx="328" cy="150" rx="4.5" ry="6" fill="none" stroke="#F87171" stroke-width="1.8"/>
    </g>

    <g>
      <rect x="362" y="130" width="118" height="76" rx="14" fill="url(#cardGrad)" stroke="#1E2A47" stroke-width="1"/>
      <text x="378" y="158" font-size="22" font-weight="bold" fill="#F3F6FC">8</text>
      <text x="378" y="176" font-size="10.5" fill="#8592B4">Repos Synced</text>
      <circle cx="456" cy="150" r="12" fill="#34D399" opacity="0.15"/>
      <circle cx="456" cy="150" r="4.5" fill="none" stroke="#34D399" stroke-width="1.8"/>
    </g>

    <!-- AI Assistant card -->
    <rect x="106" y="222" width="374" height="96" rx="16" fill="url(#aiCardGrad)" stroke="#2A3A63" stroke-width="1"/>
    <rect x="124" y="240" width="34" height="34" rx="10" fill="url(#brandGrad)"/>
    <rect x="132" y="250" width="18" height="14" rx="4" fill="#FFFFFF"/>
    <circle cx="137.5" cy="257" r="1.8" fill="#22D3EE"/>
    <circle cx="144.5" cy="257" r="1.8" fill="#22D3EE"/>
    <text x="170" y="248" font-size="12.5" font-weight="bold" fill="#F3F6FC">AI Suggestion</text>
    <text x="170" y="266" font-size="11" fill="#A6B2D1">Refactor auth middleware to handle</text>
    <text x="170" y="280" font-size="11" fill="#A6B2D1">token expiry errors more gracefully</text>
    <rect x="170" y="290" width="86" height="22" rx="11" fill="url(#brandGrad)"/>
    <text x="213" y="304.5" font-size="10" font-weight="bold" fill="#0A0F1D" text-anchor="middle">Apply Fix</text>

